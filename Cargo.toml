[workspace]
members = ["programs/*", "tests"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

[workspace.dependencies]
anchor-lang = "=1.1.2"
litesvm = "=0.12.0"
solana-instruction = "=3.5.0"
solana-keypair = "=3.1.2"
solana-message = "=3.1.0"
solana-signer = "=3.0.1"
solana-transaction = "=3.1.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
